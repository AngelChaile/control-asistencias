<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Control de Asistencias Municipal - Gestión de personal mediante QR" />
  <meta name="theme-color" content="#e11d1d" />
  
  <!-- Favicons básicos -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <!-- iOS (Apple) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
  
  <!-- Color de barra para Chrome en Android -->
  <meta name="theme-color" content="#e11d1d">
  
  <title>Control de Asistencias</title>

  <!-- ✅ EmailJS desde CDN (cargado antes de la app) -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- ✅ Inicializar EmailJS después de que el DOM esté listo -->
  <script type="text/javascript">
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof emailjs !== 'undefined') {
        emailjs.init({
          publicKey: "vZRWNMNdhko2RgFmo",
        });
        console.log('✅ EmailJS inicializado correctamente');
      } else {
        console.error('❌ EmailJS no se cargó correctamente desde el CDN');
      }
    });
  </script>
</body>
</html>
